{% extends 'base.html' %}

{% block title %}Acesso Negado - LIVRE DIA{% endblock %}

{% block extra_head %}
<style>
    /* Força a cor de fundo do main para cobrir todo o espaço */
    main {
        background-color: #f5f5f4 !important; /* stone-100 - modo claro */
    }
    .dark main {
        background-color: #1c1917 !important; /* stone-900 - modo escuro */
    }
</style>
{% endblock %}

{% block content %}
<div class="min-h-screen bg-stone-100 dark:bg-stone-900 flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white dark:bg-stone-800 rounded-xl shadow-lg p-8 text-center">
        <div class="w-16 h-16 mx-auto mb-6 bg-red-100 dark:bg-red-900 rounded-full flex items-center justify-center">
            <svg class="w-8 h-8 text-red-600 dark:text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-stone-800 dark:text-stone-100 mb-2">
            Acesso Negado
        </h1>

        <p class="text-stone-600 dark:text-stone-400 mb-6">
            {{ motivo }}
        </p>

        <div class="space-y-3">
            <a href="{% url 'vilarejo:meu_vilarejo' %}"
               class="block w-full px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-lg font-medium transition-colors duration-200">
                Ir para Meu Vilarejo
            </a>

            <a href="{% url 'core:home' %}"
               class="block w-full px-4 py-2 bg-stone-200 dark:bg-stone-700 hover:bg-stone-300 dark:hover:bg-stone-600
                      text-stone-800 dark:text-stone-200 rounded-lg font-medium transition-colors duration-200">
                Voltar para Inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
