server {
    server_name livredia.com.br www.livredia.com.br;

    client_max_body_size 10M;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location /static/ {
        alias /home/livredia/apps/livredia/staticfiles/;
    }

    location /media/ {
        alias /home/livredia/apps/livredia/media/;
    }

    # WebSocket proxy para Daphne
    location /ws/ {
        proxy_pass http://unix:/home/livredia/apps/livredia/daphne.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/home/livredia/apps/livredia/gunicorn.sock;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/livredia.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/livredia.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.livredia.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = livredia.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name livredia.com.br www.livredia.com.br;
    return 404; # managed by Certbot
}
